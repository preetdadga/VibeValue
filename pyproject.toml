[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "vibevalue"
version = "0.0.0"
description = "Financial sentiment classifier (VibeValue)"
authors = [ { name = "ML Engineer" } ]
readme = "README.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
